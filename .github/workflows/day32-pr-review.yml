name: Day 32 trusted PR review

on:
  workflow_run:
    workflows: [Day 32 PR signal]
    types: [completed]

permissions: {}

# Missing/ambiguous associations fail closed inside the reviewer.
concurrency:
  group: day32-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: day32-review
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install trusted dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Review PR data and publish report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python backend/scripts/day32_review.py actions
